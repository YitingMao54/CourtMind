<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>起居注 · 悬浮窗</title>
<style>
  :root{ --red-deep:#5c1414; --red:#7a1f1f; --gold:#b8860b; --gold-soft:#e8d9b0; --ink:#2b2620; --muted:#d9c9a6; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"Noto Serif SC","Songti SC","SimSun",serif; background:var(--red-deep); color:#f3e7d0; border-radius:12px; overflow:hidden; display:flex; flex-direction:column;}
  header{display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:rgba(0,0,0,.25); cursor:default; user-select:none;}
  header .title{font-size:13px; letter-spacing:2px; color:#f6e7c1;}
  header button{background:none; border:none; color:#d9c9a6; font-size:15px; cursor:pointer; padding:2px 6px; font-family:inherit;}
  header button:hover{color:#fff;}
  .clock{text-align:center; padding:10px 0 4px;}
  .clock b{font-size:30px; font-weight:700; color:#f6e7c1; letter-spacing:2px;}
  .clock span{display:block; font-size:11px; color:#d9c9a6; margin-top:2px; letter-spacing:1px;}
  .recents{flex:1; overflow-y:auto; padding:6px 14px 10px;}
  .recents h4{font-size:11px; color:var(--gold); letter-spacing:2px; margin:6px 0;}
  .item{border-left:3px solid var(--gold); background:rgba(255,255,255,.06); border-radius:4px; padding:6px 10px; margin-bottom:6px; font-size:12px; line-height:1.6;}
  .item .t{color:#d9c9a6; font-size:10px;}
  .item .d{color:#f6e7c1; font-weight:700;}
  .empty{font-size:12px; color:#d9c9a6; text-align:center; padding:14px 0; line-height:1.8;}
</style>
</head>
<body>
<header data-tauri-drag-region>
  <span class="title">📖 起居注</span>
  <button id="close" title="关闭">✕</button>
</header>
<div class="clock"><b id="time">--:--</b><span id="date"></span></div>
<div class="recents">
  <h4>近期裁决</h4>
  <div id="list"><div class="empty">尚无记录。<br>请先在主窗口完成一次辩论与朱批。</div></div>
</div>
<script>
function tick(){
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  document.getElementById('time').textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
  document.getElementById('date').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}`;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderList(){
  try{
    const log = JSON.parse(localStorage.getItem('grdws_log')) || [];
    const box = document.getElementById('list');
    box.innerHTML = log.length ? log.slice(0,4).map(e=>`
      <div class="item"><div class="t">${esc(e.time||'')}</div>${esc(e.question||'')}<div class="d">朱批：${esc(e.decision||'')}</div></div>`).join('')
      : '<div class="empty">尚无记录。<br>请先在主窗口完成一次辩论与朱批。</div>';
  }catch(e){}
}
document.getElementById('close').addEventListener('click', ()=>{
  if(window.__TAURI__ && window.__TAURI__.window){ window.__TAURI__.window.getCurrentWindow().close(); }
  else window.close();
});
tick(); renderList();
setInterval(tick, 10000);
setInterval(renderList, 30000); // 悬浮窗与主窗口共享 localStorage，定期同步
</script>
</body>
</html>
