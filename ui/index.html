<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贵人多忘事 · 微政务</title>
<style>
  :root{
    --paper:#f5efe0; --panel:#fffdf5; --line:#e2d7bf;
    --ink:#2b2620; --muted:#8a7f6a;
    --red:#7a1f1f; --red-deep:#5c1414; --gold:#b8860b; --gold-soft:#e8d9b0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"Noto Serif SC","Songti SC","SimSun","STSong",serif; background:var(--paper); color:var(--ink);}
  .app{display:grid; grid-template-columns:220px 1fr; height:100vh;}
  .sidebar{background:var(--red-deep); color:#f3e7d0; padding:22px 0; display:flex; flex-direction:column; gap:4px; box-shadow:2px 0 12px rgba(0,0,0,.25);}
  .brand{padding:0 22px 20px; border-bottom:1px solid rgba(255,255,255,.18); margin-bottom:12px;}
  .brand h1{font-size:24px; letter-spacing:4px; color:#f6e7c1; font-weight:700;}
  .brand p{font-size:12px; color:#d9c9a6; margin-top:6px; letter-spacing:2px;}
  .mod{display:flex; align-items:center; gap:10px; padding:11px 22px; cursor:pointer; color:#e9dcc0; font-size:15px; border-left:3px solid transparent; transition:.15s;}
  .mod:hover{background:rgba(255,255,255,.08);}
  .mod.active{background:rgba(255,255,255,.12); border-left-color:var(--gold); color:#fff;}
  .mod .tag{font-size:10px; margin-left:auto; padding:2px 6px; border-radius:8px; background:rgba(0,0,0,.25);}
  .mod .tag.done{background:var(--gold); color:#3a2800;}
  .mod .tag.todo{background:rgba(0,0,0,.35); color:#d9c9a6;}
  .main{overflow-y:auto; padding:32px 40px;}
  .main header{margin-bottom:24px;}
  .main header h2{font-size:22px; letter-spacing:2px; color:var(--red-deep);}
  .main header p{font-size:13px; color:var(--muted); margin-top:6px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px 24px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h3{font-size:16px; color:var(--red-deep); margin-bottom:12px; letter-spacing:1px;}
  textarea{width:100%; height:72px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-family:inherit; font-size:15px; background:#fff;}
  textarea:focus{outline:2px solid var(--gold); border-color:transparent;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .chip{font-family:inherit; font-size:13px; padding:6px 12px; cursor:pointer; border:1px solid var(--line); border-radius:16px; background:#fffdf5;}
  .chip:hover{border-color:var(--gold); color:var(--red-deep);}
  .btn{font-family:inherit; font-size:15px; padding:9px 22px; cursor:pointer; background:var(--red); color:#f6e7c1; border:none; border-radius:8px; letter-spacing:2px; margin-top:14px;}
  .btn:hover{background:var(--red-deep);}
  .btn.secondary{background:transparent; border:1px solid var(--red); color:var(--red);}
  .btn.small{font-size:13px; padding:5px 14px; letter-spacing:1px; margin-top:0;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .route{display:flex; align-items:center; gap:10px; padding:14px 18px; background:var(--gold-soft); border:1px solid var(--gold); border-radius:8px; font-size:15px; margin-bottom:18px;}
  .route .arrow{color:var(--red-deep); font-weight:700;}
  .route .actions{margin-left:auto; display:flex; gap:8px;}

  .roundtag{display:inline-block; font-size:12px; color:var(--gold); border:1px solid var(--gold); border-radius:6px; padding:2px 8px; margin-bottom:8px; letter-spacing:1px;}
  .memorial{border:1px solid var(--line); border-left:4px solid var(--red); border-radius:8px; padding:14px 18px; margin-bottom:12px; background:#fffef9; animation:fadein .4s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .memorial .head{display:flex; align-items:baseline; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .memorial .role{font-size:15px; font-weight:700; color:var(--red-deep);}
  .memorial .lens{font-size:11px; color:var(--gold);}
  .memorial .conf{font-size:12px; color:var(--muted); margin-left:auto;}
  .memorial .pos{font-size:14.5px; line-height:1.8; color:#3a342a;}
  .memorial .meta{margin-top:8px; font-size:13px; color:var(--muted); line-height:1.7; border-top:1px dashed var(--line); padding-top:6px;}
  .memorial .meta b{color:var(--red-deep);}
  .attack{border-left-color:var(--gold); background:#fbf6ea;}
  .attack .role{color:var(--gold);}

  .record{border:1px solid var(--gold); background:#fbf5e4; border-radius:10px; padding:18px 22px;}
  .record .r-title{font-size:16px; color:var(--red-deep); font-weight:700; letter-spacing:1px; margin-bottom:4px;}
  .record .r-conf{font-size:13px; color:var(--gold); margin-bottom:12px;}
  .record .answer{font-size:15px; line-height:1.9; background:#fffef9; border-left:3px solid var(--gold); padding:12px 16px; border-radius:6px; margin-bottom:12px;}
  .record h4{font-size:13px; color:var(--red-deep); margin:12px 0 6px; letter-spacing:1px;}
  .record ul{margin-left:18px; font-size:14px; line-height:1.8; color:#3a342a;}
  .record .diss{color:#8a3b1f;}

  .zhupi{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .zhupi input[type=text]{flex:1; min-width:220px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:14px;}
  .log-item{border-bottom:1px dashed var(--line); padding:14px 0; font-size:14px; line-height:1.8;}
  .log-item .t{color:var(--muted); font-size:12px;}
  .log-item .d{font-weight:700; color:var(--red-deep);}
  .log-item .a{margin-top:4px; background:#fffef9; padding:8px 12px; border-left:3px solid var(--gold); border-radius:4px;}
  .placeholder{color:var(--muted); font-size:14px; line-height:1.9;}
  .tag2{display:inline-block; font-size:11px; padding:2px 8px; border-radius:8px; margin-right:6px;}
  .tag2.done{background:var(--gold); color:#3a2800;}
  .tag2.todo{background:#e8e0cd; color:#6b5f45;}
  .cursor{color:var(--gold); animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  .muted-note{font-size:12px; color:var(--muted); margin-top:8px;}
  .loading-note{padding:14px 18px; background:var(--gold-soft); border:1px dashed var(--gold); border-radius:8px; font-size:14px; color:var(--red-deep); margin-bottom:18px; animation:blink 1.4s step-end infinite;}

  /* 户部 / 刑部 表格与工具栏 */
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .toolbar input[type=text]{flex:1; min-width:280px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:14px; background:#fff;}
  table.gt{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.gt th{text-align:left; color:var(--red-deep); border-bottom:2px solid var(--gold); padding:8px 10px; font-weight:700; letter-spacing:1px;}
  table.gt td{border-bottom:1px dashed var(--line); padding:8px 10px; line-height:1.6; word-break:break-all;}
  table.gt tr:hover td{background:#fbf6ea;}
  .cat{display:inline-block; font-size:11px; padding:2px 8px; border-radius:8px; background:var(--gold-soft); color:var(--red-deep); border:1px solid var(--gold); white-space:nowrap;}
  .undo-ok{color:#2e6e3a; font-weight:700;}
  .ledger-arrow{color:var(--muted); margin:0 6px;}

  /* 吏部评分 */
  .rate-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .rate-row .role{font-weight:700; color:var(--red-deep); min-width:88px;}
  .rate-btn{font-family:inherit; font-size:13px; padding:4px 12px; cursor:pointer; border-radius:14px; border:1px solid var(--line); background:#fffdf5;}
  .rate-btn.up:hover{border-color:#2e6e3a; color:#2e6e3a;}
  .rate-btn.down:hover{border-color:#8a3b1f; color:#8a3b1f;}
  .bar{flex:1; min-width:120px; height:10px; background:#eee5cf; border-radius:5px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--gold);}

  /* 谏院 / 统计 */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px;}
  .stat{background:#fffef9; border:1px solid var(--line); border-radius:8px; padding:14px 16px; text-align:center;}
  .stat b{display:block; font-size:26px; color:var(--red-deep);}
  .stat span{font-size:12px; color:var(--muted);}
  .adv{border-left:3px solid var(--red); background:#fffef9; border-radius:6px; padding:10px 14px; margin-bottom:10px; font-size:14px; line-height:1.7;}
  .adv .t{font-size:11px; color:var(--muted); margin-bottom:2px;}
  .adv.warn{border-left-color:#8a3b1f;}

  /* 翰林院检索 */
  .search-row{display:flex; gap:8px; margin-bottom:16px;}
  .search-row input{flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:14px; background:#fff;}
  .arch-item{border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:10px; background:#fffef9;}
  .arch-item .q{font-weight:700; color:var(--red-deep); font-size:14.5px;}
  .arch-item .meta{font-size:12px; color:var(--muted); margin-top:4px;}
  .arch-item .ans{font-size:13.5px; color:#3a342a; margin-top:6px; line-height:1.7;}
  mark{background:var(--gold-soft); color:var(--red-deep); padding:0 2px; border-radius:2px;}

  /* 设置行 */
  .settings{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:13px; color:var(--muted);}
  .settings .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .settings input{flex:1; min-width:220px; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-family:inherit; font-size:13px; background:#fff;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>贵人多忘事</h1><p>三省六部 · 微政务</p></div>
    <div class="mod active" data-view="flow">📜 通政司（呈奏）</div>
    <div class="mod" data-view="flow">👑 上朝（多臣辩论）</div>
    <div class="mod" data-view="hu">📁 户部（文件整理）<span class="tag done">已实现</span></div>
    <div class="mod" data-view="xing">⚖️ 刑部·大理寺（审计）<span class="tag done">已实现</span></div>
    <div class="mod" data-view="log">📖 起居注（决策记录）<span class="tag done">已实现</span></div>
    <div class="mod" data-view="li">🏛️ 吏部（臣子绩效）<span class="tag done">已实现</span></div>
    <div class="mod" data-view="jian">🔔 谏院（习惯规谏）<span class="tag done">已实现</span></div>
    <div class="mod" data-view="han">📚 翰林院（知识库）<span class="tag done">已实现</span></div>
  </aside>
  <main class="main"><div id="main-content"></div></main>
</div>

<script src="core.js"></script>
<script src="flow.js"></script>
<script src="modules.js"></script>
<script>render('flow');</script>
</body>
</html>
