<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贵人多忘事 · 为朕分忧</title>
<link rel="stylesheet" href="advanced.css">
<script src="personality.js"></script>
<script>/* 首屏前套用已存纸墨主题，避免闪白（人格由 personality.js 先行套用） */
try{var t=localStorage.getItem('grdws_theme');if(t){t=JSON.parse(t);if(t&&(PERSONAS[readPersonaId()]||{}).allowLegacyTheme)document.documentElement.setAttribute('data-theme',t);}}catch(e){}
</script>
<style>
  /* ===== 主题变量：默认「宫墙朱砂」。night / celadon 见下方覆盖 ===== */
  :root{
    --paper:#f5efe0; --panel:#fffdf5; --panel-2:#fffef9; --line:#e2d7bf;
    --ink:#2b2620; --muted:#8a7f6a;
    --red:#7a1f1f; --red-deep:#5c1414; --gold:#b8860b; --gold-soft:#e8d9b0;
    --input-bg:#ffffff; --hover:#fbf6ea; --accent-soft:#fbf5e4;
    --btn-bg:#7a1f1f; --btn-bg-hover:#5c1414; --btn-ink:#f6e7c1; --btn-warn:#8a6d1f; --btn-pet:#c9756b;
    --err:#8a3b1f; --ok:#2e6e3a;
    --sidebar-bg:#5c1414; --sidebar-ink:#f3e7d0; --sidebar-muted:#d9c9a6; --sidebar-item:#e9dcc0;
  }
  /* 夜览水墨（深色） */
  html[data-theme="night"]{
    --paper:#1b1917; --panel:#262320; --panel-2:#2c2825; --line:#3d382f;
    --ink:#ece3d2; --muted:#a2977f;
    --red:#d4796a; --red-deep:#e2937f; --gold:#d3a54f; --gold-soft:#3a3325;
    --input-bg:#211e1b; --hover:#322d26; --accent-soft:#2f2a20;
    --btn-bg:#8f3b30; --btn-bg-hover:#a8483c; --btn-ink:#f6ece0; --btn-warn:#9a7b2f; --btn-pet:#8f4a42;
    --err:#e59a80; --ok:#7fbf8a;
    --sidebar-bg:#221d18; --sidebar-ink:#efe6d2; --sidebar-muted:#b3a689; --sidebar-item:#d8ccb0;
  }
  /* 青瓷淡雅（浅绿） */
  html[data-theme="celadon"]{
    --paper:#edf1e9; --panel:#f9fbf6; --panel-2:#f4f7ef; --line:#d4ddc9;
    --ink:#26302a; --muted:#6e7a68;
    --red:#3d6b50; --red-deep:#2a5239; --gold:#96823c; --gold-soft:#e2e8d2;
    --input-bg:#ffffff; --hover:#eef2e6; --accent-soft:#e9efe0;
    --btn-bg:#3d6b50; --btn-bg-hover:#2a5239; --btn-ink:#f4f7ec; --btn-warn:#7d6b2e; --btn-pet:#b0766c;
    --err:#8a5a2f; --ok:#3d7a4f;
    --sidebar-bg:#2a5239; --sidebar-ink:#eef3e6; --sidebar-muted:#c3d0b4; --sidebar-item:#dce5cd;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"Noto Serif SC","Songti SC","SimSun","STSong",serif; background:var(--paper); color:var(--ink);}
  .app{display:grid; grid-template-columns:220px 1fr; height:100vh;}
  .sidebar{background:var(--sidebar-bg); color:var(--sidebar-ink); padding:22px 0; display:flex; flex-direction:column; gap:4px; box-shadow:2px 0 12px rgba(0,0,0,.25);}
  .brand{padding:0 22px 20px; border-bottom:1px solid rgba(255,255,255,.18); margin-bottom:12px;}
  .brand h1{font-size:24px; letter-spacing:4px; color:var(--sidebar-ink); font-weight:700;}
  .brand p{font-size:12px; color:var(--sidebar-muted); margin-top:6px; letter-spacing:2px;}
  .mod{display:flex; align-items:center; gap:10px; padding:11px 22px; cursor:pointer; color:var(--sidebar-item); font-size:15px; letter-spacing:3px; border-left:3px solid transparent; transition:.15s;}
  .mod:hover{background:rgba(255,255,255,.08);}
  .mod.active{background:rgba(255,255,255,.12); border-left-color:var(--gold); color:#fff;}
  .mod-sep{height:1px; background:rgba(255,255,255,.16); margin:12px 22px;}
  .main{overflow-y:auto; padding:32px 40px;}
  .main header{margin-bottom:24px;}
  .main header h2{font-size:22px; letter-spacing:2px; color:var(--red-deep);}
  .main header p{font-size:13px; color:var(--muted); margin-top:6px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px 24px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h3{font-size:16px; color:var(--red-deep); margin-bottom:12px; letter-spacing:1px;}
  textarea{width:100%; height:72px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-family:inherit; font-size:15px; background:var(--input-bg); color:var(--ink);}
  textarea:focus{outline:2px solid var(--gold); border-color:transparent;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .chip{font-family:inherit; font-size:13px; padding:6px 12px; cursor:pointer; border:1px solid var(--line); border-radius:16px; background:var(--panel); color:var(--ink);}
  .chip:hover{border-color:var(--gold); color:var(--red-deep);}
  .btn{font-family:inherit; font-size:15px; padding:9px 22px; cursor:pointer; background:var(--btn-bg); color:var(--btn-ink); border:none; border-radius:8px; letter-spacing:2px; margin-top:14px;}
  .btn:hover{background:var(--btn-bg-hover);}
  .btn.secondary{background:transparent; border:1px solid var(--red); color:var(--red);}
  .btn.small{font-size:13px; padding:5px 14px; letter-spacing:1px; margin-top:0;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .route{display:flex; align-items:center; gap:10px; padding:14px 18px; background:var(--gold-soft); border:1px solid var(--gold); border-radius:8px; font-size:15px; margin-bottom:18px;}
  .route .arrow{color:var(--red-deep); font-weight:700;}
  .route .actions{margin-left:auto; display:flex; gap:8px;}

  .roundtag{display:inline-block; font-size:12px; color:var(--gold); border:1px solid var(--gold); border-radius:6px; padding:2px 8px; margin-bottom:8px; letter-spacing:1px;}
  .memorial{border:1px solid var(--line); border-left:4px solid var(--red); border-radius:8px; padding:14px 18px; margin-bottom:12px; background:var(--panel-2); animation:fadein .4s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .memorial .head{display:flex; align-items:baseline; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .memorial .role{font-size:15px; font-weight:700; color:var(--red-deep);}
  .memorial .lens{font-size:11px; color:var(--gold);}
  .memorial .conf{font-size:12px; color:var(--muted); margin-left:auto;}
  .memorial .pos{font-size:14.5px; line-height:1.8; color:var(--ink);}
  .memorial .meta{margin-top:8px; font-size:13px; color:var(--muted); line-height:1.7; border-top:1px dashed var(--line); padding-top:6px;}
  .memorial .meta b{color:var(--red-deep);}
  .attack{border-left-color:var(--gold); background:var(--accent-soft);}
  .attack .role{color:var(--gold);}

  .record{border:1px solid var(--gold); background:var(--accent-soft); border-radius:10px; padding:18px 22px;}
  .record .r-title{font-size:16px; color:var(--red-deep); font-weight:700; letter-spacing:1px; margin-bottom:4px;}
  .record .r-conf{font-size:13px; color:var(--gold); margin-bottom:12px;}
  .record .answer{font-size:15px; line-height:1.9; background:var(--panel-2); border-left:3px solid var(--gold); padding:12px 16px; border-radius:6px; margin-bottom:12px;}
  .record h4{font-size:13px; color:var(--red-deep); margin:12px 0 6px; letter-spacing:1px;}
  .record ul{margin-left:18px; font-size:14px; line-height:1.8; color:var(--ink);}
  .record .diss{color:var(--err);}

  .zhupi{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .zhupi input[type=text]{flex:1; min-width:220px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:14px; background:var(--input-bg); color:var(--ink);}
  .log-item{border-bottom:1px dashed var(--line); padding:14px 0; font-size:14px; line-height:1.8;}
  .log-item .t{color:var(--muted); font-size:12px;}
  .log-item .d{font-weight:700; color:var(--red-deep);}
  .log-item .a{margin-top:4px; background:var(--panel-2); padding:8px 12px; border-left:3px solid var(--gold); border-radius:4px;}
  .placeholder{color:var(--muted); font-size:14px; line-height:1.9;}
  .tag2{display:inline-block; font-size:11px; padding:2px 8px; border-radius:8px; margin-right:6px;}
  .tag2.done{background:var(--gold); color:var(--btn-ink);}
  .tag2.todo{background:var(--line); color:var(--muted);}
  .cursor{color:var(--gold); animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  .muted-note{font-size:12px; color:var(--muted); margin-top:8px;}
  .loading-note{padding:14px 18px; background:var(--gold-soft); border:1px dashed var(--gold); border-radius:8px; font-size:14px; color:var(--red-deep); margin-bottom:18px; animation:blink 1.4s step-end infinite;}

  /* 户部 / 刑部 表格与工具栏 */
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .toolbar input[type=text]{flex:1; min-width:280px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:14px; background:var(--input-bg); color:var(--ink);}
  table.gt{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.gt th{text-align:left; color:var(--red-deep); border-bottom:2px solid var(--gold); padding:8px 10px; font-weight:700; letter-spacing:1px;}
  table.gt td{border-bottom:1px dashed var(--line); padding:8px 10px; line-height:1.6; word-break:break-all;}
  table.gt tr:hover td{background:var(--hover);}
  .cat{display:inline-block; font-size:11px; padding:2px 8px; border-radius:8px; background:var(--gold-soft); color:var(--red-deep); border:1px solid var(--gold); white-space:nowrap;}
  .undo-ok{color:var(--ok); font-weight:700;}
  .ledger-arrow{color:var(--muted); margin:0 6px;}

  /* 吏部评分 */
  .rate-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .rate-row .role{font-weight:700; color:var(--red-deep); min-width:88px;}
  .rate-btn{font-family:inherit; font-size:13px; padding:4px 12px; cursor:pointer; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--ink);}
  .rate-btn.up:hover{border-color:var(--ok); color:var(--ok);}
  .rate-btn.down:hover{border-color:var(--err); color:var(--err);}
  .bar{flex:1; min-width:120px; height:10px; background:var(--line); border-radius:5px; overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--gold);}

  /* 谏院 / 统计 */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px;}
  .stat{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:14px 16px; text-align:center;}
  .stat b{display:block; font-size:26px; color:var(--red-deep);}
  .stat span{font-size:12px; color:var(--muted);}
  .adv{border-left:3px solid var(--red); background:var(--panel-2); border-radius:6px; padding:10px 14px; margin-bottom:10px; font-size:14px; line-height:1.7;}
  .adv .t{font-size:11px; color:var(--muted); margin-bottom:2px;}
  .adv.warn{border-left-color:var(--err);}

  /* 翰林院检索 */
  .search-row{display:flex; gap:8px; margin-bottom:16px;}
  .search-row input{flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:14px; background:var(--input-bg); color:var(--ink);}
  .arch-item{border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:10px; background:var(--panel-2);}
  .arch-item .q{font-weight:700; color:var(--red-deep); font-size:14.5px;}
  .arch-item .meta{font-size:12px; color:var(--muted); margin-top:4px;}
  .arch-item .ans{font-size:13.5px; color:var(--ink); margin-top:6px; line-height:1.7;}
  mark{background:var(--gold-soft); color:var(--red-deep); padding:0 2px; border-radius:2px;}

  /* 设置行 */
  .settings{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:13px; color:var(--muted);}
  .settings .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .settings input,.settings select{border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-family:inherit; font-size:13px; background:var(--input-bg); color:var(--ink);}
  .settings select{flex:0 0 auto; cursor:pointer;}
  .settings input[type=password]{flex:1 1 200px;}
  .settings input[type=text]{flex:0 1 180px;}

  /* 实时议事状态提示条（演示数据 / 调用失败，必须让用户看得见） */
  .debate-note{font-size:13px; line-height:1.7; color:var(--ink); background:var(--gold-soft); border:1px solid var(--gold); border-radius:8px; padding:10px 14px; margin-bottom:12px;}
  .debate-note.err{border-color:var(--err); background:var(--panel-2); color:var(--err);}

  /* 邸报（活动聚合） */
  .evt-status{font-size:13.5px; color:var(--ink); align-self:center;}
  .evt-status b{color:var(--red-deep);}
  .evt-group{display:inline-block; font-size:12px; color:var(--red-deep); border:1px solid var(--gold); background:var(--gold-soft); border-radius:6px; padding:2px 10px; margin:4px 0 10px; letter-spacing:1px;}
  .evt-group.past-group{color:var(--muted); border-color:var(--line); background:var(--panel-2);}
  .evt-item{border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:10px; background:var(--panel-2);}
  .evt-item.past{opacity:.55;}
  .evt-title{font-weight:700; color:var(--red-deep); font-size:14.5px; line-height:1.6;}
  .evt-title .cat{margin-right:8px; vertical-align:1px;}
  .evt-meta{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .evt-desc{font-size:13px; color:var(--ink); line-height:1.7; margin-top:6px; opacity:.85;}
  .evt-dl{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .evt-dl.soon{color:var(--err); font-weight:700;}
  .evt-past-tag{color:var(--err);}

  /* 侧边栏底部主题切换 */
  .themes{margin-top:auto; padding:16px 22px 4px; border-top:1px solid rgba(255,255,255,.18); display:flex; align-items:center; gap:9px;}
  .themes .lbl{font-size:12px; color:var(--sidebar-muted); letter-spacing:2px; margin-right:2px;}
  .theme-dot{width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,.35); background:var(--dot); cursor:pointer; padding:0; transition:.15s;}
  .theme-dot:hover{transform:scale(1.12);}
  .theme-dot.active{border-color:var(--gold); box-shadow:0 0 0 2px rgba(184,134,11,.4);}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>贵人多忘事</h1><p id="brand-sub">三省六部 · 为朕分忧</p></div>
    <div class="mod active" data-view="flow" data-nav="tongzheng">通政司</div>
    <div class="mod" data-view="flow" data-nav="court">上朝</div>
    <div class="mod" data-view="hu" data-nav="hubu">户部</div>
    <div class="mod" data-view="xing" data-nav="xingbu">刑部 · 大理寺</div>
    <div class="mod" data-view="log" data-nav="qijuzhu">起居注</div>
    <div class="mod" data-view="events" data-nav="events">邸报</div>
    <div class="mod" data-view="li" data-nav="libu">吏部</div>
    <div class="mod" data-view="jian" data-nav="jianyuan">谏院</div>
    <div class="mod" data-view="han" data-nav="hanlin">翰林院</div>
    <div class="mod-sep"></div>
    <div class="mod" data-view="profile" data-nav="profile">我的画像</div>
    <div class="mod" data-view="persona" data-nav="persona">人格 · 朝廷</div>
    <div class="themes" id="theme-bar">
      <span class="lbl">纸墨</span>
      <button class="theme-dot" data-theme="court" style="--dot:#7a1f1f" title="宫墙朱砂"></button>
      <button class="theme-dot" data-theme="night" style="--dot:#2b2620" title="夜览水墨"></button>
      <button class="theme-dot" data-theme="celadon" style="--dot:#3d6b50" title="青瓷淡雅"></button>
    </div>
  </aside>
  <main class="main"><div id="main-content"></div></main>
</div>

<script src="core.js"></script>
<script src="behavior.js"></script>
<script src="events.js"></script>
<script src="flow.js"></script>
<script src="modules.js"></script>
<script>syncPersonaUI(); render('flow');</script>
</body>
</html>
